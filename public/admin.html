<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>EVILVERSE — замовлення</title>
  <link rel="icon" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0404; --card: #1a0a08; --line: #3a1510; --text: #f6ebe5; --muted: #b8a09a;
      --red: #ff2424; --orange: #ff6a00; --amber: #ffb347; --green: #7cff3b;
      --fire: linear-gradient(135deg, #ff2a1a 0%, #ff6a00 55%, #ffb347 100%);
      --font: "Pixelify Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line);
      background: linear-gradient(160deg, #2a0705 0%, #120404 60%, #0a0404 100%); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 22px; background: var(--fire); -webkit-background-clip: text; background-clip: text; color: transparent; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    input, select, button { font-family: var(--font); font-size: 15px; }
    input, select { background: #120505; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
    input:focus, select:focus { outline: none; border-color: var(--orange); }
    button { border: 1px solid var(--line); background: #1f0907; color: var(--text); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    button:hover { border-color: var(--orange); }
    button.fire { background: var(--fire); border: 0; color: #160303; font-weight: 700; }
    button.ok { background: #143a0a; border-color: #2f7a17; color: var(--green); }
    button.bad { background: #3a0a0a; border-color: #7a1717; color: #ff6b6b; }
    .grow { flex: 1; }
    .muted { color: var(--muted); }
    .login { max-width: 420px; margin: 60px auto; display: grid; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
    .orders { display: grid; gap: 10px; }
    .order { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
    .order .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .code { font-weight: 700; color: var(--amber); font-size: 18px; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 13px; border: 1px solid var(--line); }
    .b-pending { color: var(--amber); } .b-paid { color: var(--green); } .b-cancelled { color: #ff6b6b; }
    .b-delivered { color: var(--green); } .b-manual { color: var(--amber); } .b-failed { color: #ff6b6b; } .b-waiting { color: var(--muted); }
    .items { font-size: 15px; }
    .total { font-weight: 700; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    details { font-size: 13px; color: var(--muted); }
    pre { white-space: pre-wrap; margin: 6px 0 0; font-family: ui-monospace, monospace; font-size: 12px; }
    .manual { color: var(--amber); font-size: 14px; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .mono { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; display: grid; gap: 4px; }
    .mono .err { color: #ff6b6b; } .mono .ok { color: var(--green); }
    .paylog { color: var(--green); font-size: 14px; }
    .prefix-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
    .prefix-box.p-pending { border-color: #c800ff; }
    .prefix-box.p-approved { color: var(--green); }
    .prefix-box.p-rejected { color: #ff6b6b; }
    .prefix-text { color: var(--amber); font-size: 16px; }
    @media (max-width: 640px) { header h1 { font-size: 18px; } }
  </style>
</head>
<body>
  <header>
    <h1>EVILVERSE · Замовлення</h1>
    <span class="grow"></span>
    <select id="filter" aria-label="Фільтр">
      <option value="pending">Очікують оплату</option>
      <option value="paid">Оплачені</option>
      <option value="cancelled">Скасовані</option>
      <option value="all">Усі</option>
      <option value="prefix">Префікси на перевірці</option>
      <option value="votes">Голоси з моніторингів</option>
    </select>
    <button id="refresh">Оновити</button>
    <button id="logout">Вийти</button>
  </header>
  <main>
    <form class="login" id="login" hidden>
      <b>Вхід для адміністрації</b>
      <span class="muted">Введи ADMIN_TOKEN із налаштувань сайту (Vercel → Settings → Environment Variables).</span>
      <input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN" required />
      <button class="fire" type="submit">Увійти</button>
      <span class="muted" id="loginError"></span>
    </form>
    <div class="mono" id="mono" hidden></div>
    <div class="orders" id="orders"></div>
  </main>

  <script>
    "use strict";
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const KEY = "ev_admin_token";
    let token = sessionStorage.getItem(KEY) || "";
    const NAMES = {
      prime: "Prime (30 дн.)", prime_plus: "Prime+ (30 дн.)", prime_inf: "Prime ∞ (30 дн.)", c_subs: "Кейс Підписок",
      bis: "Біс", prizrak: "Привид", cerber: "Цербер", zhnets: "Жнець", demon: "Демон", arhidemon: "Архідемон",
      vladyka: "Владика", bezodnya: "Безодня",
      t100: "100 фішок", t300: "300+30 фішок", t600: "600+90 фішок", t1200: "1200+240 фішок", t3000: "3000+900 фішок",
      unban: "Розбан", unmute: "Розмут", nickcolor: "Кольоровий нік", prefix: "Свій префікс",
      c_xp: "Кейс Досвіду", c_titles: "Кейс Титулів", c_ranks: "Кейс Привілегій",
      vote: "Нагорода за голос", vote_bonus: "Бонус за 5 голосів",
    };
    const DELIVERY = {
      null: ["waiting", "чекає видачі"], delivered: ["delivered", "видано ✔"],
      manual: ["manual", "частково — видати вручну"], failed: ["failed", "помилка видачі"],
      legacy: ["delivered", "видано раніше (вручну)"],
    };
    const STATUS = { pending: "очікує оплату", paid: "оплачено", cancelled: "скасовано" };
    const METHODS = { free: "безкоштовно (Prime ∞)", mono: "monobank (авто)", ton: "USDT TON (авто)", privat: "Приват", crypto: "USDT TRC20 (авто)", donatepay: "DonatePay ₽ (авто)", stars: "Telegram Stars (авто)", vote: "голос на моніторингу" };

    const PROVIDERS = { mono: ["Банка monobank", "грн"], ton: ["USDT (TON)", "USDT"], tron: ["USDT (TRC20)", "USDT"], donatepay: ["DonatePay (рублі)", "₽"], stars: ["Telegram Stars", "⭐"] };
    function renderPayments(p) {
      const box = $("#mono");
      const when = (s) => s ? esc(new Date(s.split(" ")[0]).toLocaleString("uk-UA")) : "ще не було";
      const parts = Object.entries(p || {}).filter(([, m]) => m && m.configured).map(([key, m]) => {
        const [title, unit] = PROVIDERS[key] || [key, ""];
        const err = m.lastError && (!m.lastOk || m.lastError.split(" ")[0] > m.lastOk)
          ? `<div class="err">Помилка перевірки: ${esc(m.lastError)}</div>` : "";
        const un = (m.unmatched || []).length
          ? `<details><summary>${key === "tron" ? "Платежі, сума яких не збіглася із замовленням" : "Платежі без коду замовлення"} (${m.unmatched.length}) — підтверди вручну</summary><pre>${esc(m.unmatched.map((u) => `${new Date(u.paidAt).toLocaleString("uk-UA")} · ${u.amount} ${unit} · ${u.comment || "без коментаря"}`).join("\n"))}</pre></details>` : "";
        return `<div><b>${title}</b> · автоперевірка оплат · <span class="ok">остання успішна: ${when(m.lastOk)}</span></div>${err}${un}`;
      });
      box.hidden = !parts.length;
      box.innerHTML = parts.join("");
    }

    async function api(method, body, query = "") {
      const res = await fetch("/api/admin/orders" + query, {
        method, headers: { Authorization: "Bearer " + token, ...(body ? { "Content-Type": "application/json" } : {}) },
        body: body ? JSON.stringify(body) : undefined, cache: "no-store",
      });
      if (res.status === 401) { logout("Невірний токен"); throw new Error("unauthorized"); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.status);
      return data;
    }

    function item(i) {
      const dur = (i.dur === "30" && !String(NAMES[i.id] || "").includes("30 дн")) ? " · 30 дн." : i.dur === "forever" ? " · назавжди" : "";
      return `${esc(NAMES[i.id] || i.id)}${dur}${i.qty > 1 ? " ×" + i.qty : ""}${i.text ? ` «<b>${esc(i.text)}</b>»` : ""}`;
    }

    function render(list) {
      if (!list.length) { $("#orders").innerHTML = `<div class="empty">Немає замовлень</div>`; return; }
      $("#orders").innerHTML = list.map((o) => {
        const d = DELIVERY[o.deliveryStatus ?? "null"] || DELIVERY.null;
        const delivery = o.status === "paid" ? `<span class="badge b-${d[0]}">${d[1]}</span>` : "";
        const gift = o.giftTo ? ` → подарунок для <b>${esc(o.giftTo)}</b>` : "";
        const prefixItem = (o.items || []).find((i) => i.id === "prefix");
        const prefixBox = prefixItem && o.prefixStatus ? `<div class="prefix-box p-${esc(o.prefixStatus)}">
            <span>Префікс: <b class="prefix-text">${esc(prefixItem.text || "—")}</b> ·
              ${o.prefixStatus === "pending" ? (o.status === "paid" ? "чекає твого рішення" : "буде на перевірці після оплати")
                : o.prefixStatus === "approved" ? "схвалено ✔" : `відхилено${o.prefixNote ? ": " + esc(o.prefixNote) : ""}`}</span>
            ${o.prefixStatus === "pending" && o.status === "paid" ? `<span class="actions">
              <button class="ok" data-act="prefix-approve" data-code="${esc(o.code)}">✔ Схвалити</button>
              <button class="bad" data-act="prefix-reject" data-code="${esc(o.code)}">✖ Відхилити</button></span>` : ""}
          </div>` : "";
        const manual = (o.deliveryManual || []).length ? `<div class="manual">Видати вручну: ${esc(o.deliveryManual.join(", "))}</div>` : "";
        const paylog = (o.paymentLog || []).length ? `<div class="paylog">${esc(o.paymentLog.join(" · "))}</div>` : "";
        const log = (o.deliveryLog || []).length ? `<details><summary>Журнал видачі</summary><pre>${esc(o.deliveryLog.join("\n"))}</pre></details>` : "";
        const actions = [
          o.status !== "paid" ? `<button class="ok" data-act="paid" data-code="${esc(o.code)}">✔ Оплачено</button>` : "",
          o.status === "pending" ? `<button class="bad" data-act="cancelled" data-code="${esc(o.code)}">✖ Скасувати</button>` : "",
          o.status === "paid" && (o.deliveryStatus === "failed" || o.deliveryStatus === "manual")
            ? `<button data-act="redeliver" data-code="${esc(o.code)}">↻ Повторити видачу</button>` : "",
          o.status === "paid" && o.method !== "free"
            ? `<button data-act="${o.isDemo ? "demo-off" : "demo-on"}" data-code="${esc(o.code)}" title="Тестові замовлення не показуються в стрічці покупок і топі донатерів">${o.isDemo ? "↩ Не тестове" : "🙈 Тестове"}</button>` : "",
          o.status === "paid" && o.method === "stars" && (o.paymentLog || []).some((l) => l.startsWith("Telegram Stars: +"))
            ? `<button class="bad" data-act="refund-stars" data-code="${esc(o.code)}">↩ Повернути зірки</button>` : "",
        ].join("");
        return `<article class="order">
          <div class="top">
            <span class="code">${esc(o.code)}</span>
            <span class="badge b-${esc(o.status)}">${esc(STATUS[o.status] || o.status)}</span>
            ${o.isDemo ? `<span class="badge">тест</span>` : ""}
            ${delivery}
            <span class="grow"></span>
            <span class="muted">${esc(new Date(o.createdAt).toLocaleString("uk-UA"))}</span>
          </div>
          <div>Нік: <b>${esc(o.nick)}</b>${gift} · Discord: ${esc(o.discord)} · Оплата: ${esc(METHODS[o.method] || o.method)}${o.promo ? " · промокод " + esc(o.promo) : ""}</div>
          <div class="items">${o.items.map(item).join(" · ")}</div>
          <div class="total">Сума: ${esc(o.total)} грн${o.payAmount ? ` = ${esc(o.payAmount)} ${o.method === "donatepay" ? "₽" : o.method === "stars" ? "⭐" : "USDT"}` : ""}${o.discount ? ` <span class="muted">(знижка ${esc(o.discount)})</span>` : ""}</div>
          ${prefixBox}${paylog}${manual}${log}
          ${actions ? `<div class="actions">${actions}</div>` : ""}
        </article>`;
      }).join("");
    }

    async function load() {
      if (!token) return showLogin();
      try {
        const data = await api("GET", null, "?status=" + encodeURIComponent($("#filter").value));
        render(data.orders);
        renderPayments(data.payments);
      } catch (e) {
        if (String(e.message) !== "unauthorized") $("#orders").innerHTML = `<div class="empty">Помилка: ${esc(e.message)}</div>`;
      }
    }

    function showLogin(error = "") {
      $("#login").hidden = false; $("#orders").innerHTML = ""; $("#loginError").textContent = error;
    }
    function logout(error = "") { token = ""; sessionStorage.removeItem(KEY); showLogin(error); }

    $("#login").addEventListener("submit", (e) => {
      e.preventDefault();
      token = $("#token").value.trim();
      sessionStorage.setItem(KEY, token);
      $("#login").hidden = true;
      load();
    });
    $("#logout").addEventListener("click", () => logout());
    $("#refresh").addEventListener("click", load);
    $("#filter").addEventListener("change", load);
    $("#orders").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const code = btn.dataset.code, act = btn.dataset.act;
      let payload;
      if (act === "prefix-approve") {
        if (!confirm(`Схвалити префікс у замовленні ${code}? Його буде видано в грі автоматично.`)) return;
        payload = { code, prefix: "approve" };
      } else if (act === "prefix-reject") {
        const note = prompt(`Причина відмови для ${code} (необов'язково). Гроші за платний префікс повертаєш вручну.`, "");
        if (note === null) return;
        payload = { code, prefix: "reject", note };
      } else if (act === "demo-on" || act === "demo-off") {
        if (act === "demo-on" && !confirm(`Позначити ${code} як тестове? Воно зникне зі стрічки покупок і топу донатерів (а якщо ще не видане — не видасться на сервер).`)) return;
        payload = { code, demo: act === "demo-on" };
      } else if (act === "refund-stars") {
        if (!confirm(`Повернути зірки за ${code}? Telegram поверне їх гравцю, замовлення стане скасованим.\nЯкщо товар уже видано в грі — забери його вручну.`)) return;
        payload = { code, refundStars: true };
      } else {
        const question = act === "paid" ? `Підтвердити оплату ${code}? Товар буде видано автоматично.`
          : act === "cancelled" ? `Скасувати замовлення ${code}?` : `Повторити видачу ${code}? Вже видане повторно не видається.`;
        if (!confirm(question)) return;
        payload = act === "redeliver" ? { code, redeliver: true } : { code, status: act };
      }
      btn.disabled = true;
      try {
        const res = await api("PATCH", payload);
        if (act === "refund-stars") alert(res.delivered ? "Зірки повернено. Товар уже був виданий у грі — забери його вручну." : "Зірки повернено, замовлення скасовано.");
        await load();
      } catch (err) {
        const why = { no_user_id: "у платежі немає id гравця (оплата була до оновлення сайту) — поверни через бота вручну",
          already_refunded: "зірки за це замовлення вже повернено", no_stars_payment: "платіж зірками не знайдено" }[err.message];
        alert("Помилка: " + (why || err.message)); btn.disabled = false;
      }
    });
    if (token) load(); else showLogin();
    setInterval(() => { if (token && !document.hidden) load(); }, 20000);
  </script>
</body>
</html>
