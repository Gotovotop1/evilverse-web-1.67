<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>EVILVERSE — варіанти аватарки</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#0a0404;color:#ffe9d6;font-family:system-ui,sans-serif;padding:40px 20px}
    h1{margin:0 0 6px;font-size:28px;text-align:center}
    p.lead{margin:0 auto 32px;max-width:560px;text-align:center;color:#c9a27e}
    .grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;max-width:1200px;margin:0 auto}
    figure{margin:0;width:220px;padding:16px;border:1px solid #3a1a10;border-radius:16px;background:#140806;text-align:center}
    img{width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:12px;display:block}
    .small{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px}
    .small img{width:40px;height:40px;border-radius:8px}
    .small img.s{width:24px;height:24px;border-radius:5px}
    figcaption{margin-top:12px;font-weight:600}
    figcaption small{display:block;margin-top:2px;color:#c9a27e;font-weight:400}
    a{color:#ff9a3c}
  </style>
</head>
<body>
  <h1>Варіанти аватарки EVILVERSE</h1>
  <p class="lead">Усі п&apos;ять намальовані піксель за пікселем (16×16). Обери номер — і я поставлю її в шапку сайту, на іконку вкладки та в підвал.</p>
  <div class="grid">
    <figure><img src="/avatars/option-1-demon.svg" alt="Варіант 1: Демон" /><div class="small"><img src="/avatars/option-1-demon.svg" alt="" /><img class="s" src="/avatars/option-1-demon.svg" alt="" /></div><figcaption>1 · Демон<small>рогата голова</small></figcaption></figure>
    <figure><img src="/avatars/option-2-lava-e.svg" alt="Варіант 2: Лавовий блок з літерою E" /><div class="small"><img src="/avatars/option-2-lava-e.svg" alt="" /><img class="s" src="/avatars/option-2-lava-e.svg" alt="" /></div><figcaption>2 · Лавовий блок E<small>блок лави з літерою</small></figcaption></figure>
    <figure><img src="/avatars/option-3-creeper.svg" alt="Варіант 3: Криперо-демон" /><div class="small"><img src="/avatars/option-3-creeper.svg" alt="" /><img class="s" src="/avatars/option-3-creeper.svg" alt="" /></div><figcaption>3 · Криперо-демон<small>кріпер із рогами</small></figcaption></figure>
    <figure><img src="/avatars/option-4-skull.svg" alt="Варіант 4: Палаючий череп" /><div class="small"><img src="/avatars/option-4-skull.svg" alt="" /><img class="s" src="/avatars/option-4-skull.svg" alt="" /></div><figcaption>4 · Палаючий череп<small>череп з вогнем</small></figcaption></figure>
    <figure><img src="/avatars/option-5-gate.svg" alt="Варіант 5: Пекельні врата" /><div class="small"><img src="/avatars/option-5-gate.svg" alt="" /><img class="s" src="/avatars/option-5-gate.svg" alt="" /></div><figcaption>5 · Пекельні врата<small>портал в Незер</small></figcaption></figure>
  </div>
  <p class="lead" style="margin-top:32px"><a href="/index.html">← На сайт</a></p>
</body>
</html>
